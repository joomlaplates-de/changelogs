name: Validate and generate changelogs
on:
  push:
    branches: [main]
    paths: ['histories/**', 'products.json', 'scripts/**', 'test/**', 'package.json', '.github/workflows/changelogs.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: changelogs-${{ github.ref }}
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: npm run build
      - name: Publish generated files
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated
          if ! git diff --cached --quiet; then
            git commit -m "Update generated changelogs"
            git push
          fi
